<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <span class="eyebrow">UM PASSO DE CADA VEZ</span>
        <h1>Minhas tarefas<span>.</span></h1>
        <p>Organize suas ideias e abra espaço para o que importa.</p>
      </header>

      <div class="workspace">
      <form id="item-form" class="panel" aria-labelledby="form-heading">
        <h2 id="form-heading">Uma nova tarefa</h2>
        <p class="hint">O próximo passo começa aqui.</p>
        <label for="item-name">Nome da tarefa</label>
        <input id="item-name" name="Name" placeholder="O que você precisa fazer?" required />
        <label for="item-description">Descrição <span class="optional">(opcional)</span></label>
        <textarea id="item-description" name="Description" rows="4" placeholder="Anote os detalhes para lembrar depois..."></textarea>
        <button type="submit">Adicionar tarefa <span aria-hidden="true">+</span></button>
      </form>

      <section class="tasks" aria-labelledby="list-heading">
        <div class="list-header">
          <h2 id="list-heading">Sua lista</h2>
          <span class="count" id="item-count">0 tarefas</span>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <ul id="item-list"></ul>
      </section>
      </div>
    </main>
  </body>
</html>
